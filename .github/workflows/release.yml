name: Release

# Builds the APK for a `v*` tag and attaches it to a draft GitHub Release.
#
# It deliberately needs NO secrets. The upload key never leaves the release
# machine, so what CI produces is signed with the throwaway Android debug key
# (android/app/build.gradle.kts falls back to it when android/key.properties is
# absent). That APK is for sideloading and manual QA:
#
#   - it cannot be uploaded to Play, which requires the upload key;
#   - it cannot be installed over a build from Play, or over an APK from an
#     earlier run — the runner generates a fresh debug key each time, and
#     Android refuses an update whose signature changed. Uninstall first.
#
# The Play artifact is built on the release machine with tool/build_release.ps1,
# which is the only place the upload key is used. See docs/RELEASE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the APK to a draft GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.2"
  JAVA_VERSION: "21"

jobs:
  release:
    name: Build the tag's APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test --exclude-tags live

      - name: Validate the bundled guide
        run: dart run tool/validate_guide.dart

      - name: Read the version, and check the tag agrees with it
        id: version
        run: |
          # versionName+versionCode both come from pubspec.yaml, which is what
          # the build actually uses; a tag that disagrees with it would ship
          # something other than what the tag says.
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -1)"
          name="${version%%+*}"
          code="${version##*+}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "pubspec: $version (versionName $name, versionCode $code)"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "v$name" ]; then
              echo "::error::tag $tag does not match pubspec version $name — bump pubspec.yaml or retag"
              exit 1
            fi
          fi

      - name: Build APK
        run: |
          # No android/key.properties here on purpose: Gradle falls back to the
          # debug signing config, and the step below proves that is what
          # happened rather than a key having leaked into CI.
          test ! -f android/key.properties
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}"

      - name: Confirm the APK is not signed with the upload key
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apksig.txt

          # The usual check inverted. A CI artifact carrying the real upload
          # certificate would mean the key had reached the runner, and anyone
          # with the build could then publish as this app.
          grep -qi "CN=Android Debug" /tmp/apksig.txt \
            || { echo "::error::this APK is not debug-signed — is a keystore reaching CI?"; exit 1; }

      - name: Confirm the manifest targets Android 16
        run: |
          MANIFEST=build/app/intermediates/packaged_manifests/release/processReleaseManifestForPackage/AndroidManifest.xml
          grep -oE 'android:(minSdkVersion|targetSdkVersion|versionCode|versionName)="[^"]*"' "$MANIFEST" | sort -u
          grep -q 'android:targetSdkVersion="36"' "$MANIFEST" \
            || { echo "::error::targetSdkVersion is not 36"; exit 1; }

      - name: Name the artifact after the version
        id: artifact
        run: |
          # The name has to say what it is: someone finding this on a Release
          # page must not mistake it for the build that went to Play.
          out="srbguide-${{ steps.version.outputs.version }}-debug-signed.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - name: Write the run summary
        run: |
          {
            echo "### ${{ steps.version.outputs.version }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`${{ steps.artifact.outputs.path }}\` ($(du -h "${{ steps.artifact.outputs.path }}" | cut -f1)) |"
            echo "| Signed with | the Android debug key — **not** the upload key |"
            echo "| Good for | sideloading and manual QA |"
            echo "| Not good for | Play, or updating an install signed by anything else |"
            echo ""
            echo "The Play bundle is built on the release machine:"
            echo "\`.\\tool\\build_release.ps1\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          body: |
            The attached APK is signed with the **Android debug key**, not the
            Play upload key. Install it by sideloading, uninstalling any earlier
            copy first — Android refuses an update whose signature changed, and
            every CI run signs with a fresh debug key.

            The Play build of this tag is produced separately with
            `tool/build_release.ps1`, which is the only place the upload key is
            used.
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
