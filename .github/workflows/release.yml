name: Release

# Builds a Play-ready, signed App Bundle and a signed APK, then proves the
# signature is what Play expects (APK Signature Scheme v2/v3, SHA-256) before
# publishing anything.
#
# Required repository secrets — see docs/RELEASE.md for how to produce them:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach artifacts to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.2"
  JAVA_VERSION: "21"

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test --exclude-tags live

      - name: Fail fast if signing secrets are missing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; missing=1; fi
          done
          # A release signed with the debug key is worse than no release: Play
          # rejects it and it can never be upgraded to a real key.
          [ "$missing" = "0" ] || exit 1

      - name: Restore keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "${RUNNER_TEMP}/upload-keystore.jks"
          test -s "${RUNNER_TEMP}/upload-keystore.jks"

      - name: Write android/key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=${RUNNER_TEMP}/upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Check the signing key itself uses SHA-256
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "${RUNNER_TEMP}/upload-keystore.jks" \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" > /tmp/keyinfo.txt
          grep -E "Signature algorithm name:" /tmp/keyinfo.txt
          if ! grep -qiE "Signature algorithm name:\s*SHA256with" /tmp/keyinfo.txt; then
            echo "::error::upload key is not SHA-256; regenerate it with -sigalg SHA256withRSA"
            exit 1
          fi
          grep -E "^\s+SHA256:" /tmp/keyinfo.txt | head -1

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "Using $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apksig.txt

          # Play requires v2+; v2/v3 are SHA-256 based, unlike the old v1 JAR
          # signing, so this is the check that "signed with SHA-256" means.
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksig.txt \
            || { echo "::error::APK is not signed with APK Signature Scheme v2"; exit 1; }
          grep -qi "Signer #1 certificate SHA-256 digest" /tmp/apksig.txt \
            || { echo "::error::no SHA-256 certificate digest reported"; exit 1; }
          if grep -qi "CN=Android Debug" /tmp/apksig.txt; then
            echo "::error::APK was signed with the debug key"; exit 1
          fi

      - name: Verify App Bundle signature
        run: |
          jarsigner -verify -strict -verbose:summary \
            build/app/outputs/bundle/release/app-release.aab | tail -20

      - name: Report signing details
        run: |
          {
            echo "### Signed release"
            echo ""
            echo "| Artifact | Size |"
            echo "|---|---|"
            echo "| app-release.aab | $(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1) |"
            echo "| app-release.apk | $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1) |"
            echo ""
            echo '```'
            grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" /tmp/apksig.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the manifest targets Android 16
        run: |
          MANIFEST=build/app/intermediates/packaged_manifests/release/processReleaseManifestForPackage/AndroidManifest.xml
          grep -oE 'android:(minSdkVersion|targetSdkVersion)="[^"]*"' "$MANIFEST" | sort -u
          grep -q 'android:targetSdkVersion="36"' "$MANIFEST" \
            || { echo "::error::targetSdkVersion is not 36"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "${RUNNER_TEMP}/upload-keystore.jks"
